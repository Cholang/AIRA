<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아이라 UI 텍스트 검수</title>
<!--
  UI 텍스트 검수 도구 (2026-10-17). 빌드에 들어가지 않는다.
  - Claude가 검수할 문구를 JSON 하나(요청 하나)로 이 폴더에 둔다: { title, created, about, standard?, rows: [{ id, text, edit, context, where, files, applied, buttons?, buttonsNote? }] }
  - buttons(2026-10-18): 그 문장과 함께 나오는 버튼 [{ label, primary, std, edit }] — 맨 앞이 주 버튼, std = 버튼 단어 표준의 단어(바꾸면 모든 곳이 바뀜).
    standard: 표준 단어 목록 [{ label, meaning }] — 화면 위에 늘 보인다(외우지 않아도 되게)
  - 사용자는 Edge(또는 Chrome)에서 이 파일을 열고 → JSON 열기 → 2열(edit)에 바꿀 말 입력 → 저장(같은 파일에 덮어씀). 비운 칸은 지금 문구 그대로.
  - Claude는 edit가 있는 줄만 코드에 반영하고 applied에 날짜를 적는다.
-->
<style>
:root {
  --bg: #17181a; --surface: #202225; --surface-2: #282a2e; --line: #34373b; --text: #e9e6e0; --muted: #9c9993;
  --accent: #a9a6f7; --ok: #72bf8e; --warn: #f0a93b; --fail: #f07a52;
  --font: 'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.6; word-break: keep-all; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 1500px; margin: 0 auto; padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
h1 { margin: 0 12px 0 0; font-size: 18px; font-weight: 800; }
button { font: inherit; font-size: 14px; white-space: nowrap; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #17153a; font-weight: 700; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: flex; gap: 4px; }
.seg button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.sp { flex: 1; }
.state { font-size: 13px; color: var(--muted); }
.state[data-dirty="true"] { color: var(--warn); }
main { max-width: 1500px; margin: 0 auto; padding: 18px 20px 80px; }
.intro h2 { margin: 0; font-size: 20px; }
.intro p { margin: 6px 0 0; max-width: 1100px; color: var(--muted); white-space: pre-line; }
.empty { margin-top: 60px; text-align: center; color: var(--muted); }
.empty b { color: var(--text); }
.drop { outline: 2px dashed var(--accent); outline-offset: -8px; }
table { width: 100%; margin-top: 16px; border-collapse: collapse; table-layout: fixed; }
th { position: sticky; top: 61px; z-index: 1; background: var(--bg); text-align: left; font-size: 13px; font-weight: 700; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { vertical-align: top; padding: 10px; border-bottom: 1px solid var(--line); }
col.n { width: 46px; } col.t { width: 28%; } col.e { width: 28%; } col.b { width: 19%; } col.c { width: auto; }
.std-legend { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.std-legend b { color: var(--text); font-weight: 700; }
.btns { display: grid; gap: 6px; }
.btn { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 6px; }
.chip { font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.btn[data-primary="true"] .chip { background: var(--accent); border-color: var(--accent); color: #17153a; font-weight: 700; }
.btn[data-std="true"] .chip::after { content: ' 표준'; font-size: 11px; opacity: .7; }
.btn input { min-width: 0; font: inherit; font-size: 13px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text); }
.btn input:not(:placeholder-shown) { border-color: var(--accent); }
.bnote { margin-top: 6px; font-size: 12px; color: #6f6d68; white-space: pre-line; }
td.n { color: var(--muted); font-size: 12px; padding-top: 14px; }
.text { white-space: pre-wrap; }
.tok { color: var(--accent); }
textarea { width: 100%; min-height: 44px; resize: vertical; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; line-height: 1.6; field-sizing: content; }
textarea::placeholder { color: #5f5d59; }
tr[data-edited="true"] textarea { border-color: var(--accent); }
.ctx { white-space: pre-line; color: var(--muted); font-size: 14px; }
.where { margin-top: 6px; font-size: 12px; color: #6f6d68; }
.note { margin-top: 6px; font-size: 13px; }
.note.warn { color: var(--warn); }
.note.ok { color: var(--ok); }
tr[data-applied="true"] .text { color: var(--muted); }
tr[hidden] { display: none; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>UI 텍스트 검수</h1>
    <button id="open" class="primary">JSON 열기</button>
    <button id="save" disabled>저장</button>
    <span class="seg" role="group" aria-label="보기">
      <button data-f="all" aria-pressed="true">전체</button>
      <button data-f="edited" aria-pressed="false">입력한 줄</button>
      <button data-f="todo" aria-pressed="false">반영 안 된 줄</button>
    </span>
    <span class="sp"></span>
    <span class="state" id="state">열린 파일 없음</span>
  </div>
</header>
<main id="main">
  <div class="empty" id="empty">
    <p><b>JSON 열기</b>로 검수할 파일(이 폴더의 <code>날짜-이름.json</code>)을 고르거나, 파일을 이 창에 끌어다 놓으세요.</p>
    <p>2열에 바꿀 문구를 적고 <b>저장</b>(Ctrl+S)하면 같은 파일에 저장됩니다. 비운 칸은 지금 문구 그대로 둡니다.</p>
    <p>Edge나 Chrome에서 열어야 같은 파일에 저장됩니다. 다른 브라우저는 저장 대신 내려받기가 됩니다.</p>
  </div>
  <section class="intro" id="intro" hidden><h2 id="title"></h2><p id="about"></p><div class="std-legend" id="std"></div></section>
  <table id="table" hidden>
    <colgroup><col class="n"><col class="t"><col class="e"><col class="b"><col class="c"></colgroup>
    <thead><tr><th>#</th><th>지금 문구 (앱에 쓰인 그대로)</th><th>바꿀 문구 (비우면 그대로)</th><th>버튼 (맨 앞이 주 버튼 · 칸에 바꿀 이름)</th><th>언제 나오나</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
let data = null, handle = null, fileName = '', dirty = false, filter = 'all'
const $ = (id) => document.getElementById(id)
const canPick = 'showOpenFilePicker' in window

/** {대상}·{n} 같은 바뀌는 자리 */
const tokens = (s) => (s.match(/\{[^}]+\}/g) || []).sort()
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const mark = (s) => esc(s).replace(/\{[^}]+\}/g, (t) => `<span class="tok">${t}</span>`)

/** 이 줄에 입력이 있나 (문구 또는 버튼 이름) */
const isEdited = (r) => !!(r.edit && r.edit.trim()) || (r.buttons || []).some((b) => b.edit && b.edit.trim())

function setDirty(v) {
  dirty = v
  const edited = data ? data.rows.filter(isEdited).length : 0
  $('state').textContent = data ? `${fileName} · ${data.rows.length}줄 · 입력 ${edited}줄${dirty ? ' · 저장 안 함' : ''}` : '열린 파일 없음'
  $('state').dataset.dirty = dirty
  $('save').disabled = !data || !dirty
}

function note(r) {
  const e = (r.edit || '').trim()
  if (r.applied) return `<div class="note ok">반영함 · ${esc(String(r.applied))}</div>`
  const std = (r.buttons || []).filter((b) => b.std && b.edit && b.edit.trim()).map((b) => b.label)
  const stdNote = std.length ? `<div class="note warn">표준 단어(${esc(std.join(', '))})를 바꾸면 그 단어를 쓰는 모든 버튼이 함께 바뀝니다. 이 줄만 바꾸려면 그렇다고 적어 주세요.</div>` : ''
  if (!e) return stdNote
  const a = tokens(r.text).join(), b = tokens(e).join()
  return (a !== b ? `<div class="note warn">바뀌는 자리(${tokens(r.text).join(' ') || '없음'})가 지금 문구와 다릅니다. 일부러 뺐거나 더했다면 그대로 두셔도 됩니다.</div>` : '') + stdNote
}

/** 글 길이에 맞춰 높이 — field-sizing을 쓰는 브라우저(Edge·Chrome)는 CSS가 맡는다 */
const autoSize = CSS.supports('field-sizing', 'content')
function fit(t) { if (autoSize || !t.isConnected) return; t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px' }

function render() {
  $('empty').hidden = !!data
  $('intro').hidden = $('table').hidden = !data
  if (!data) return
  $('title').textContent = data.title || fileName
  $('about').textContent = data.about || ''
  $('std').innerHTML = (data.standard || []).length ? '버튼 단어 표준: ' + data.standard.map((x) => `<span><b>${esc(x.label)}</b> ${esc(x.meaning)}</span>`).join('') : ''
  const body = $('rows')
  body.innerHTML = ''
  data.rows.forEach((r, i) => {
    const tr = document.createElement('tr')
    tr.innerHTML = `<td class="n">${i + 1}</td>
      <td><div class="text">${mark(r.text)}</div></td>
      <td><textarea rows="2" placeholder="그대로 두려면 비워 두세요" aria-label="${i + 1}번 바꿀 문구"></textarea><div class="msg">${note(r)}</div></td>
      <td><div class="btns">${(r.buttons || []).map((b, k) => `<label class="btn" data-primary="${!!b.primary}" data-std="${!!b.std}"><span class="chip">${mark(b.label)}</span><input data-k="${k}" placeholder="그대로" aria-label="${i + 1}번 버튼 ${esc(b.label)} 바꿀 이름"></label>`).join('')}</div>${r.buttonsNote ? `<div class="bnote">${esc(r.buttonsNote)}</div>` : ''}</td>
      <td><div class="ctx">${esc(r.context || '')}</div>${r.where ? `<div class="where">${esc(r.where)}</div>` : ''}</td>`
    const ta = tr.querySelector('textarea')
    ta.value = r.edit || ''
    tr.querySelectorAll('.btn input').forEach((inp) => {
      const b = r.buttons[+inp.dataset.k]
      inp.value = b.edit || ''
      inp.addEventListener('input', () => { b.edit = inp.value; sync(); setDirty(true); applyFilter() })
    })
    const sync = () => {
      tr.dataset.edited = isEdited(r)
      tr.dataset.applied = !!r.applied
      tr.querySelector('.msg').innerHTML = note(r)
    }
    ta.addEventListener('input', () => { r.edit = ta.value; fit(ta); sync(); setDirty(true); applyFilter() })
    sync()
    body.appendChild(tr)
    requestAnimationFrame(() => fit(ta))
  })
  applyFilter()
}

function applyFilter() {
  if (!data) return
  ;[...$('rows').children].forEach((tr, i) => {
    const r = data.rows[i]
    tr.hidden = filter === 'edited' ? !isEdited(r) : filter === 'todo' ? !!r.applied : false
  })
}

function load(text, name, h) {
  let d
  try { d = JSON.parse(text) } catch { return alert('JSON을 읽지 못했습니다: ' + name) }
  if (!d || !Array.isArray(d.rows)) return alert('검수 파일 모양이 아닙니다 (rows가 없음): ' + name)
  data = d; handle = h || null; fileName = name
  render(); setDirty(false)
}

async function open() {
  if (dirty && !confirm('저장하지 않은 입력이 있습니다. 다른 파일을 열까요?')) return
  if (canPick) {
    try {
      const [h] = await window.showOpenFilePicker({ types: [{ description: '검수 JSON', accept: { 'application/json': ['.json'] } }] })
      const f = await h.getFile()
      load(await f.text(), f.name, h)
    } catch (e) { if (e.name !== 'AbortError') alert('파일을 열지 못했습니다: ' + e.message) }
  } else {
    const inp = Object.assign(document.createElement('input'), { type: 'file', accept: '.json' })
    inp.onchange = async () => { const f = inp.files[0]; if (f) load(await f.text(), f.name, null) }
    inp.click()
  }
}

async function save() {
  if (!data) return
  const json = JSON.stringify(data, null, 2) + '\n'
  try {
    if (handle && handle.createWritable) {
      const w = await handle.createWritable()
      await w.write(json)
      await w.close()
    } else {
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([json], { type: 'application/json' })), download: fileName || 'textedit.json' })
      a.click()
      URL.revokeObjectURL(a.href)
      alert('이 브라우저는 같은 파일에 저장하지 못해 내려받았습니다. 내려받은 파일로 docs/textedit의 원래 파일을 바꿔 주세요.')
    }
    setDirty(false)
  } catch (e) { alert('저장하지 못했습니다: ' + e.message) }
}

$('open').onclick = open
$('save').onclick = save
document.querySelectorAll('.seg button').forEach((b) => b.onclick = () => {
  filter = b.dataset.f
  document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', x === b))
  applyFilter()
})
addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (dirty) save() } })
addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = '' } })
// 끌어다 놓기 (끌어 놓은 파일은 같은 자리에 저장할 수 없어 저장하면 내려받기 — 같은 파일에 저장하려면 JSON 열기)
addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('drop') })
addEventListener('dragleave', () => document.body.classList.remove('drop'))
addEventListener('drop', async (e) => {
  e.preventDefault(); document.body.classList.remove('drop')
  const item = e.dataTransfer.items && e.dataTransfer.items[0]
  if (item && item.getAsFileSystemHandle) {
    const h = await item.getAsFileSystemHandle()
    if (h && h.kind === 'file') { const f = await h.getFile(); return load(await f.text(), f.name, h) }
  }
  const f = e.dataTransfer.files[0]
  if (f) load(await f.text(), f.name, null)
})
render(); setDirty(false)
</script>
</body>
</html>
